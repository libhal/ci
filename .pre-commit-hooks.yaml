# Hooks that other repositories can use from their .pre-commit-config.yaml:
#
#   - repo: https://github.com/libhal/ci
#     rev: <a release tag>
#     hooks:
#       - id: no-continue-infinite-loop

- id: no-continue-infinite-loop
  name: Infinite loops Clang deletes (body is only continue)
  description: >
    Rejects an infinite loop whose body is only `continue;`, such as
    `while (true) { continue; }`. The compiler may assume that a loop without
    side effects ends, so Clang deletes it and execution falls into the next
    function. Leave the body empty, with a comment inside saying why. See the
    libhal style guide, S.3.7.
  language: pygrep
  # --multiline matches across lines, with re.MULTILINE and re.DOTALL. Only the
  # first match in each file is printed.
  args: [--multiline]
  files: \.(c|cc|cpp|cppm|cxx|h|hh|hpp|hxx|inc|ipp)$
  entry: |
    (?x)
    # A comment or white space, between the braces of the body.
    # (?:\s|//[^\n]*\n|/\*.*?\*/)*
    #
    # `while (true)`, `while (1)` (or any other nonzero integer literal) or
    # `for (;;)`, then a body of only `continue;`
    (?: \b while \s* \( \s* (?: true | [1-9][\w']* ) \s* \) | \b for \s* \( \s* ; \s* ; \s* \) )
    \s*
    (?: \{ (?:\s|//[^\n]*\n|/\*.*?\*/)* continue \s* ; (?:\s|//[^\n]*\n|/\*.*?\*/)* \}
      | continue \s* ;
    )
    # or `do`, a body of only `continue;`, then `while` with the same conditions
    | \b do \s*
      (?: \{ (?:\s|//[^\n]*\n|/\*.*?\*/)* continue \s* ; (?:\s|//[^\n]*\n|/\*.*?\*/)* \}
        | continue \s* ;
      )
      \s* while \s* \( \s* (?: true | [1-9][\w']* ) \s* \)
