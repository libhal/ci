name: 📦 Conan Package & Upload (all)

# Builds packages for the devices and architectures libhal supports. It runs
# in one of two modes:
#
#   check  (`version` is "latest", nothing is uploaded): `MinSizeRel` only and
#          a sample of Cortex-M architectures.
#   deploy (`version` is set): every build type and architecture.

on:
  workflow_call:
    inputs:
      library:
        type: string
        default: ${{ github.event.repository.name }}
      repo:
        type: string
        default: ${{ github.repository }}
      version:
        type: string
        default: latest
      conan_version:
        type: string
        default: 2.22.2
      dir: # Directory where the conan package exists
        type: string
        default: .
      remote_url:
        type: string
        default: ""
      modules_support_needed:
        type: boolean
        default: False
      coroutine_support_needed:
        type: boolean
        default: False
      ci_ref:
        type: string
        default: "5.x.y"
        description: "Git ref (branch, tag, or SHA) of libhal/ci to use for scripts"
      extra_conan_arguments:
        type: string
        default: ""
        description: "Extra arguments to pass to conan create commands"
      llvm_profile:
        type: string
        default: hal/tc/llvm
        description: "Compiler profile for the LLVM builds, e.g. hal/tc/llvm-23"

    secrets:
      conan_remote_password:
        required: false
      conan_remote_user:
        required: false

jobs:
  # Decides what the jobs below build. Check runs (version "latest", nothing
  # is uploaded) build less than deploys, which build everything they upload.
  plan:
    name: 📋 Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_types: ${{ steps.plan.outputs.build_types }}
      cortex_m_llvm: ${{ steps.plan.outputs.cortex_m_llvm }}
      cortex_m_gcc: ${{ steps.plan.outputs.cortex_m_gcc }}
    steps:
      - name: 📋 Choose build types and architectures
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          COROUTINES: ${{ inputs.coroutine_support_needed }}
        run: |
          # ARMv6-M (M0, M0+, M1) is left out of the LLVM builds when
          # coroutine support is needed.
          if [ "$COROUTINES" = "true" ]; then
            armv6m=""
          else
            armv6m="cortex-m0,cortex-m0plus,cortex-m1,"
          fi

          if [ "$VERSION" = "latest" ]; then
            # Check run: one build type and a sample of Cortex-M cores
            build_types="MinSizeRel"
            sample="cortex-m3,cortex-m4f,cortex-m33f"
            llvm_sample="${armv6m:+cortex-m0plus,}$sample"
            cortex_m_llvm=$(jq -nc --arg archs "$llvm_sample" \
              '[{name: "M sample", archs: $archs}]')
            cortex_m_gcc="cortex-m0plus,$sample"
          else
            # Deploy: every build type and Cortex-M core. Building every core in
            # one job is slow, so LLVM builds them in three parallel jobs.
            build_types="Debug,MinSizeRel,Release"
            cortex_m_llvm=$(jq -nc --arg armv6m "$armv6m" '[
              { name: "M0-M4",   archs: ($armv6m + "cortex-m3,cortex-m4") },
              { name: "M4F-M23", archs: "cortex-m4f,cortex-m7f,cortex-m7d,cortex-m23" },
              { name: "M33-M85", archs: "cortex-m33,cortex-m33f,cortex-m35pf,cortex-m55,cortex-m85" }
            ]')
            cortex_m_gcc="cortex-m0,cortex-m0plus,cortex-m1,cortex-m3,cortex-m4,cortex-m4f,cortex-m7f,cortex-m7d,cortex-m23,cortex-m33,cortex-m33f,cortex-m35pf,cortex-m55,cortex-m85"
          fi

          {
            echo "build_types=$build_types"
            echo "cortex_m_llvm=$cortex_m_llvm"
            echo "cortex_m_gcc=$cortex_m_gcc"
          } | tee -a "$GITHUB_OUTPUT"

  linux_x86_64_llvm:
    needs: plan
    uses: ./.github/workflows/package_and_upload.yml
    with:
      name: 🐉 LLVM 🐧 Linux x86_64
      # Target specific
      runner_os: ubuntu-24.04
      arch: x86_64
      os: Linux
      compiler_profile: ${{ inputs.llvm_profile }}
      # Plumbing
      library: ${{ inputs.library }}
      repo: ${{ inputs.repo }}
      conan_version: ${{ inputs.conan_version }}
      version: ${{ inputs.version }}
      dir: ${{ inputs.dir }}
      remote_url: ${{ inputs.remote_url }}
      extra_conan_arguments: ${{ inputs.extra_conan_arguments }}
      build_types: ${{ needs.plan.outputs.build_types }}
    secrets:
      conan_remote_user: ${{ secrets.conan_remote_user }}
      conan_remote_password: ${{ secrets.conan_remote_password }}

  linux_armv8_llvm:
    needs: plan
    uses: ./.github/workflows/package_and_upload.yml
    with:
      name: 🐉 LLVM 🐧 Linux ARM64
      # Target specific
      runner_os: ubuntu-24.04-arm
      arch: armv8
      os: Linux
      compiler_profile: ${{ inputs.llvm_profile }}
      # Plumbing
      library: ${{ inputs.library }}
      repo: ${{ inputs.repo }}
      conan_version: ${{ inputs.conan_version }}
      version: ${{ inputs.version }}
      dir: ${{ inputs.dir }}
      remote_url: ${{ inputs.remote_url }}
      extra_conan_arguments: ${{ inputs.extra_conan_arguments }}
      build_types: ${{ needs.plan.outputs.build_types }}
    secrets:
      conan_remote_user: ${{ secrets.conan_remote_user }}
      conan_remote_password: ${{ secrets.conan_remote_password }}

  mac_os_x_llvm:
    needs: plan
    uses: ./.github/workflows/package_and_upload.yml
    with:
      name: 🐉 LLVM 🍎 Mac ARM64
      # Target specific
      # macOS 26: on 14/15 the LLVM 22+ toolchain bundles its own libc++,
      # which conflicts with the ASan runtime's system libc++.
      runner_os: macos-26
      arch: armv8
      os: Macos
      compiler_profile: ${{ inputs.llvm_profile }}
      # Plumbing
      library: ${{ inputs.library }}
      repo: ${{ inputs.repo }}
      conan_version: ${{ inputs.conan_version }}
      version: ${{ inputs.version }}
      dir: ${{ inputs.dir }}
      remote_url: ${{ inputs.remote_url }}
      extra_conan_arguments: ${{ inputs.extra_conan_arguments }}
      build_types: ${{ needs.plan.outputs.build_types }}
    secrets:
      conan_remote_user: ${{ secrets.conan_remote_user }}
      conan_remote_password: ${{ secrets.conan_remote_password }}

  # ================ ARM CORTEX LLVM ================

  cortex-m_llvm:
    name: 🐉 LLVM Arm Cortex ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One entry per job: {name, archs}. See the plan job.
        include: ${{ fromJSON(needs.plan.outputs.cortex_m_llvm) }}
    env:
      VERBOSE: 1
      CONAN_REMOTE_USER: ${{ secrets.conan_remote_user }}
      CONAN_REMOTE_PASSWORD: ${{ secrets.conan_remote_password }}
    steps:
      - name: 📥 Checkout target repository
        uses: actions/checkout@v4.1.1
        if: ${{ inputs.version != 'latest' }}
        with:
          submodules: true
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.version }}
          path: target-repo

      - name: 📥 Checkout target repository (latest)
        uses: actions/checkout@v4.1.1
        if: ${{ inputs.version == 'latest' }}
        with:
          submodules: true
          repository: ${{ inputs.repo }}
          path: target-repo

      - name: 📥 Checkout CI repository for scripts
        uses: actions/checkout@v4.1.1
        with:
          repository: libhal/ci
          ref: ${{ inputs.ci_ref }}
          path: ci-repo

      - name: 📦 Build packages for Cortex ${{ matrix.name }}
        working-directory: target-repo
        run: |
          bash ../ci-repo/.github/scripts/baremetal_package.sh \
            --dir ${{ inputs.dir }} \
            --version ${{ inputs.version }} \
            --compiler-profile ${{ inputs.llvm_profile }} \
            --conan-version ${{ inputs.conan_version }} \
            --arch-list ${{ matrix.archs }} \
            --build-types ${{ needs.plan.outputs.build_types }} \
            --extra-conan-args "${{ inputs.extra_conan_arguments }}"

      - name: 📡 Add conan user remote-package-repo
        if: ${{ inputs.remote_url != '' }}
        run: conan remote add --force remote-package-repo ${{ inputs.remote_url }}

      - name: 📡 Sign into Conan Package Repository
        if: ${{ inputs.version != 'latest' && inputs.remote_url != '' && env.CONAN_REMOTE_USER != '' && env.CONAN_REMOTE_PASSWORD != '' }}
        run: conan remote login -p ${{ secrets.conan_remote_password }} remote-package-repo ${{ secrets.conan_remote_user }}

      - name: 🆙 Upload package version ${{ inputs.version }} to conan repo
        if: ${{ inputs.version != 'latest' && inputs.remote_url != '' }}
        run: conan upload "${{ inputs.library }}/${{ inputs.version }}" --confirm -r=remote-package-repo

  # ================ ARM CORTEX GCC ================

  cortex-m_gcc:
    name: 🦌 GCC Arm Cortex M
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ inputs.modules_support_needed == false }}
    env:
      VERBOSE: 1
      CONAN_REMOTE_USER: ${{ secrets.conan_remote_user }}
      CONAN_REMOTE_PASSWORD: ${{ secrets.conan_remote_password }}
    steps:
      - name: 📥 Checkout target repository
        uses: actions/checkout@v4.1.1
        if: ${{ inputs.version != 'latest' }}
        with:
          submodules: true
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.version }}
          path: target-repo

      - name: 📥 Checkout target repository (latest)
        uses: actions/checkout@v4.1.1
        if: ${{ inputs.version == 'latest' }}
        with:
          submodules: true
          repository: ${{ inputs.repo }}
          path: target-repo

      - name: 📥 Checkout CI repository for scripts
        uses: actions/checkout@v4.1.1
        with:
          repository: libhal/ci
          ref: ${{ inputs.ci_ref }}
          path: ci-repo

      - name: 📦 Build packages for Cortex-M architectures
        working-directory: target-repo
        run: |
          bash ../ci-repo/.github/scripts/baremetal_package.sh \
            --dir ${{ inputs.dir }} \
            --version ${{ inputs.version }} \
            --compiler-profile hal/tc/gcc \
            --conan-version ${{ inputs.conan_version }} \
            --arch-list ${{ needs.plan.outputs.cortex_m_gcc }} \
            --build-types ${{ needs.plan.outputs.build_types }} \
            --extra-conan-args "${{ inputs.extra_conan_arguments }}"

      - name: 📡 Add conan user remote-package-repo
        if: ${{ inputs.remote_url != '' }}
        run: conan remote add --force remote-package-repo ${{ inputs.remote_url }}

      - name: 📡 Sign into Conan Package Repository
        if: ${{ inputs.version != 'latest' && inputs.remote_url != '' && env.CONAN_REMOTE_USER != '' && env.CONAN_REMOTE_PASSWORD != '' }}
        run: conan remote login -p ${{ secrets.conan_remote_password }} remote-package-repo ${{ secrets.conan_remote_user }}

      - name: 🆙 Upload package version ${{ inputs.version }} to conan repo
        if: ${{ inputs.version != 'latest' && inputs.remote_url != '' }}
        run: conan upload "${{ inputs.library }}/${{ inputs.version }}" --confirm -r=remote-package-repo
