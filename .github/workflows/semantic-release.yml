name: 🏷️ Semantic Release
on:
  push:
    branches: [main]

# Versions are computed from the tags present when a run starts. Don't let two
# pushes compute the same version.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  # Releases this repository from (minor) and (patch) in commit subjects,
  # using its own semantic_release.yml at the pushed commit.
  release:
    uses: ./.github/workflows/semantic_release.yml
    with:
      lines: '[{"major": 5, "dir": "."}]'
      ci_ref: ${{ github.sha }}
    secrets:
      release_token: ${{ secrets.SEMANTIC_RELEASE }}
